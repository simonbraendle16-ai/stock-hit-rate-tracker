<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Sheet</title>
  <link rel="stylesheet" href="./playbook.css">
  <script src="./playbook.js" defer></script>
</head>
<body>
  <main id="app">
    <section class="choose-panel" aria-labelledby="choose-title">
      <h2 id="choose-title">Choose what <span>YOU</span> want</h2>
      <div class="choose-options">
        <div class="choose-option">
          <h3>Entweder</h3>
          <figure>
            <img src="./choose-focus.jpg" alt="Mann am Felsrand lässt Dinge los, die ihn ablenken" loading="lazy">
            <figcaption><small>Wenn</small><strong>Opfer bringen</strong></figcaption>
          </figure>
          <span class="choose-arrow" aria-hidden="true">↓</span>
          <figure>
            <img src="./choose-rising.png" alt="Steigender Kursverlauf in Grün" loading="lazy">
            <figcaption><small>Dann</small><strong>Rendite</strong></figcaption>
          </figure>
        </div>
        <div class="choose-option">
          <h3>Oder</h3>
          <figure>
            <img src="./choose-distractions.jpg" alt="Mann im Sessel zwischen Snacks, Serien und Games" loading="lazy">
            <figcaption><small>Wenn</small><strong>Kein Opfer bringen</strong></figcaption>
          </figure>
          <span class="choose-arrow" aria-hidden="true">↓</span>
          <figure>
            <img src="./choose-falling.png" alt="Fallender Kursverlauf in Rot" loading="lazy">
            <figcaption><small>Dann</small><strong>Rendite</strong></figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
