# Der Takt für die Alarm-Prüfung (Etappe 14).
#
# Vercel-Hobby lässt nur EINEN Cron-Lauf pro Tag zu und lehnt sonst das ganze
# Deployment ab. Deshalb kommt der Takt von hier: alle fünf Minuten ein Aufruf
# der Route, die dann die Kurse prüft und Meldungen verschickt.
#
# EINRICHTUNG (einmalig, von Hand):
#   1. Im GitHub-Repo unter Settings → Secrets and variables → Actions anlegen:
#        APP_URL      z. B. https://deine-app.vercel.app   (ohne Schrägstrich am Ende)
#        CRON_SECRET  derselbe Wert wie in den Vercel-Projekt-Einstellungen
#   2. Diese Datei committen und pushen — der Zeitplan startet von selbst.
#
# Alternative ohne GitHub: derselbe Aufruf bei cron-job.org, mit dem Header
#   Authorization: Bearer <CRON_SECRET>
#
# Hinweis: GitHub führt geplante Läufe unter Last verzögert aus; fünf Minuten
# sind der Wunsch, nicht die Garantie. Für geplante Einstiege trägt das —
# ein Signal, das auf die Sekunde kommen muss, gehört ohnehin nicht in eine Mail.
#
# MELDEVERHALTEN (seit 09.08.2026)
# Ein roter Lauf erzeugt eine GitHub-Mail. Bei einem Fünf-Minuten-Takt sind das
# bis zu 288 Mails am Tag, solange eine Störung dauert — beim Neon-Transferlimit
# im August genau so geschehen. Zwei Bremsen stehen deshalb davor:
#   1. Dreimal versuchen, bevor etwas als Ausfall gilt (gegen einzelne Aussetzer).
#   2. Rot wird nur der ERSTE Fehlschlag einer Störung; solange sie anhält,
#      bleiben die Läufe grün. Erst nach einer Erholung meldet sich die nächste
#      Störung wieder.
# Ergebnis: eine Mail je Störung statt einer Mail je Lauf.

name: Alarme prüfen

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # von Hand anstoßbar, zum Testen

permissions:
  contents: read
  # Für den Blick auf den vorherigen Lauf (siehe „Nur einmal Bescheid geben").
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Prüflauf anstoßen
        id: pruefen
        run: |
          # Dreimal versuchen, bevor das als Ausfall gilt. Ein einzelner
          # Aussetzer — Kaltstart der Funktion, kurzer Netzhänger — ist kein
          # toter Alarm-Takt, hat aber bisher zuverlässig eine Mail ausgelöst.
          code=000
          for versuch in 1 2 3; do
            code=$(curl --silent --show-error --location \
              --max-time 60 \
              --output response.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "${{ secrets.APP_URL }}/api/cron/check-alerts")
            echo "Versuch $versuch: HTTP $code"
            [ "$code" = "200" ] && break
            [ "$versuch" -lt 3 ] && sleep 10
          done
          cat response.json || true
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # NUR EINMAL BESCHEID GEBEN
      #
      # Ein roter Lauf ist eine Mail. Bei einem Takt von fünf Minuten sind das
      # 288 Mails am Tag, solange der Ausfall dauert — beim Neon-Transferlimit
      # im August genau so passiert. Eine Meldung, die im Minutentakt kommt,
      # liest niemand mehr; sie richtet also das Gegenteil dessen an, wofür sie
      # da ist.
      #
      # Deshalb: rot wird nur der ERSTE Fehlschlag einer Störung. War der
      # vorherige Lauf schon rot, bleibt dieser grün — die Störung ist bereits
      # gemeldet. Sobald es wieder läuft, ist der nächste Fehlschlag wieder
      # eine neue Störung und meldet sich erneut.
      #
      # Ein dauerhaft toter Takt fällt damit weiterhin auf: Die erste Mail kam,
      # und die Lauf-Übersicht bleibt rot. Nur die Wiederholung entfällt.
      - name: Ausfall bewerten
        if: steps.pruefen.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vorher=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion' 2>/dev/null || echo "unbekannt")
          echo "Vorheriger Lauf: $vorher"
          if [ "$vorher" = "failure" ]; then
            echo "::warning::Alarm-Takt weiterhin gestört — bereits gemeldet, keine erneute Meldung."
            exit 0
          fi
          echo "::error::Alarm-Takt gestört: /api/cron/check-alerts antwortet nicht mit 200."
          exit 1

      # Derselbe Takt füllt den Kerzenspeicher (Migration 0027). Die Route
      # entscheidet SELBST, ob sie fällig ist (alle zwei Stunden) und antwortet
      # sonst sofort mit `ran: false` — deshalb darf sie hier bei jedem
      # Fünf-Minuten-Durchgang mitlaufen, ohne 288-mal am Tag zu arbeiten.
      #
      # `continue-on-error`, weil das Sammeln Beiwerk ist: Ein Kerzenspeicher,
      # der einmal nicht wächst, ist ärgerlich — ein Alarm-Takt, der deswegen
      # rot steht, verdeckt einen echten Ausfall.
      - name: Kerzenspeicher füllen
        continue-on-error: true
        run: |
          code=$(curl --silent --show-error --location \
            --max-time 60 \
            --output candles.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/collect-candles")
          echo "HTTP $code"
          cat candles.json
          if [ "$code" != "200" ]; then exit 1; fi
